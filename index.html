<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ribi</title>

<link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="hero">

    <!-- 背景 -->
    <div class="bg"></div>

    <!-- 粒子 -->
    <canvas id="particles"></canvas>

    <!-- 左UI -->
    <div class="ui">
        <h1 class="name">Ribi.</h1>

        <div class="info">
            Age : 19<br>
            Height : 158cm<br>
            Personality : Cheerful & Curious
        </div>

        <!-- Tabs -->
        <div class="tabs">
            <button class="tab active" data-tab="profile">PROFILE</button>
            <button class="tab" data-tab="stream">STREAM</button>
            <button class="tab" data-tab="gallery">GALLERY</button>
        </div>

        <!-- Panel -->
        <div class="panel">

            <!-- PROFILE -->
            <div class="tab-content active" id="profile">
                <div class="views">
                    <img src="img/front_view.png">
                    <img src="img/side_view.png">
                    <img src="img/back_view.png">
                </div>
            </div>

            <!-- STREAM -->
            <div class="tab-content" id="stream">
                <iframe width="100%" height="200"
                src="https://youtube.com/@ribi_yazawa?si=LUDxeD1VvXBnnU1B"
                frameborder="0" allowfullscreen></iframe>
            </div>

            <!-- GALLERY -->
            <div class="tab-content" id="gallery">
                <div class="gallery">
                    <img src="img/g1.png">
                    <img src="img/g2.png">
                    <img src="img/g3.png">
                </div>
            </div>

        </div>
    </div>

    <!-- 右角色 -->
    <div class="character">
        <img src="img/full-body.png" class="main-char">
    </div>

</div>

<script src="js/script.js"></script>

</body>
</html>
