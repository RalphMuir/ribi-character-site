<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ribi Character</title>

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"/>

</head>

<body>

<div class="scroll-container">

<!-- HERO -->
<section class="hero">
    <div class="bg" id="bg"></div>

    <div class="top-ui">

        <div class="tabs">
            <span class="tab active">CHARACTER</span>
            <span class="tab">LORE</span>
            <span class="tab">MEMORY</span>
        </div>

        <div class="swiper mySwiper">
            <div class="swiper-wrapper" id="swiper-wrapper"></div>
        </div>

    </div>

    <div class="scroll-hint">SCROLL ↓</div>
</section>

<!-- CONTENT -->
<section class="content">

    <div class="left">
        <h1 id="char-name">Loading...</h1>
        <div id="char-info"></div>

        <div class="view-panel">
            <img id="front" class="view-img">
            <img id="side" class="view-img">
            <img id="back" class="view-img">
        </div>
    </div>

    <div class="right">
        <img id="main-char" class="main-char">
    </div>

</section>

</div>

<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
<script src="js/script.js"></script>

</body>
</html>
