<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ribi Showcase</title>

<link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="hero">

    <div class="bg"></div>
    <canvas id="particles"></canvas>

    <!-- 左UI -->
    <div class="ui">
        <h1 class="name" id="charName">Ribi.</h1>

        <div class="info" id="charInfo">
            Age : 19<br>
            Height : 158cm<br>
            Personality : Cheerful
        </div>

        <!-- 書本 -->
        <div class="book" id="book">

            <!-- 左頁 -->
            <div class="page left-page">
                <div class="page-content" id="pageLeft"></div>
            </div>

            <!-- 右頁 -->
            <div class="page right-page">
                <div class="page-content" id="pageRight"></div>
            </div>

        </div>

    </div>

    <!-- 角色 -->
    <div class="character">
        <img id="mainChar" src="img/full-body.png" class="main-char">

        <div class="arrow left" onclick="prevChar()">❮</div>
        <div class="arrow right" onclick="nextChar()">❯</div>
    </div>

</div>

<script src="js/script.js"></script>

</body>
</html>
