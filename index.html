<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ribi Showcase</title>

<link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="hero">

    <div class="bg"></div>
    <canvas id="particles"></canvas>

    <div class="container">

        <!-- 左 UI -->
        <div class="ui">

            <h1 class="name">Ribi.</h1>

            <div class="info">
                Age : 19<br>
                Height : 158cm<br>
                Personality : Cheerful & Curious
            </div>

            <div class="tabs">
                <button class="tab active" onclick="switchTab(event,'profile')">PROFILE</button>
                <button class="tab" onclick="switchTab(event,'stream')">STREAM</button>
                <button class="tab" onclick="switchTab(event,'gallery')">GALLERY</button>
            </div>

            <div class="panel" id="panel"></div>

        </div>

        <!-- 角色 -->
        <div class="character">
            <img src="img/full-body.png" class="main-char" id="char">

            <div class="arrow left" onclick="prevChar()">❮</div>
            <div class="arrow right" onclick="nextChar()">❯</div>
        </div>

    </div>

</div>

<div class="lightbox" id="lightbox" onclick="closeLightbox()">
    <img id="lightbox-img">
</div>

<script src="js/script.js"></script>

</body>
</html>
