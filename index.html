<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Character Showcase | Ribi</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="scroll-container">
    <section class="page-top" id="hero-section">
        <div class="background-overlay"></div>
        <div class="mid-nav">
            <div class="tabs-top">
                <span class="tab-item-top active">Profile</span>
                <span class="tab-item-top">Story</span>
                <span class="tab-item-top">Gallery</span>
            </div>
            <div class="swiper visual-swiper">
                <div class="swiper-wrapper">
                    <div class="swiper-slide"><img src="img/thumb1.jpg" alt="Visual 1"></div>
                    <div class="swiper-slide"><img src="img/thumb2.jpg" alt="Visual 2"></div>
                    <div class="swiper-slide"><img src="img/thumb3.jpg" alt="Visual 3"></div>
                </div>
            </div>
            <div class="visual-footer">
                <div class="nav-arrow prev-btn">❮</div>
                <div class="line"></div>
                <span>Visual</span>
                <div class="line"></div>
                <div class="nav-arrow next-btn">❯</div>
            </div>
        </div>
    </section>

    <section class="page-bottom">
        <div class="info-box">
            <h1 class="char-name">Ribi.</h1>
            <div class="stats">
                Age : 19<br>
                Height : 158cm<br>
                Personality : Cheerful & Curious
            </div>

            <div class="sub-tabs">
                <button class="s-tab active" data-target="profile-content">Profile</button>
                <button class="s-tab" data-target="skills-content">Skills</button>
                <button class="s-tab" data-target="gallery-content">Gallery</button>
            </div>

            <div id="profile-content" class="tab-content active">
                <div class="profile-swiper-container">
                    <div class="swiper profile-swiper">
                        <div class="swiper-wrapper">
                            <div class="swiper-slide">
                                <div class="view-panel">
                                    <div class="view-item">
                                        <div class="view-img-box"><img src="img/front_view.png" class="char-view"></div>
                                        <div class="view-label">FRONT VIEW</div>
                                    </div>
                                    <div class="view-item">
                                        <div class="view-img-box"><img src="img/side_view.png" class="char-view"></div>
                                        <div class="view-label">SIDE VIEW</div>
                                    </div>
                                    <div class="view-item">
                                        <div class="view-img-box"><img src="img/back_view.png" class="char-view"></div>
                                        <div class="view-label">BACK VIEW</div>
                                    </div>
                                </div>
                            </div>
                            <div class="swiper-slide">
                                <div class="full-view-panel">
                                    <img src="img/full_showcase.png" alt="Full" class="full-char-img">
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="profile-nav">
                        <div class="p-prev">❮</div>
                        <div class="p-next">❯</div>
                    </div>
                </div>
            </div>

            <div id="skills-content" class="tab-content">
                </div>
        </div>

        <div class="full-body-visual" style="background-image: url('img/full-body.png');"></div>
    </section>
</div>

<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
<script src="js/script.js"></script>
</body>
</html>
